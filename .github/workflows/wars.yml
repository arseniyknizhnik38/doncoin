# Клановые войны: подведение итогов и составление пар.
#
# Запускается ежедневно, хотя война длится неделю. Ежедневный запуск нужен
# по двум причинам: закрыть войну в понедельник как можно ближе к сроку и
# подобрать пару кланам, созданным в середине недели.
#
# Обе операции идемпотентны, поэтому лишний запуск ничего не портит.
# Нужен секрет репозитория CRON_SECRET с тем же значением, что в Vercel.

name: wars

on:
  schedule:
    # 00:10 UTC — сразу после смены недели по UTC (война идёт с понедельника).
    - cron: '10 0 * * *'
  workflow_dispatch: {}

jobs:
  wars:
    runs-on: ubuntu-latest
    steps:
      - name: Подвести итоги и составить пары
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: https://doncoin.vercel.app/api/cron/wars
        run: |
          # Разбор случаев — тот же, что в notify.yml: без секрета эндпоинт
          # неотличим от несуществующего, и молчаливое падение ничего бы не
          # объяснило.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Секрет CRON_SECRET не задан в репозитории"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Имя CRON_SECRET, значение — то же, что в переменных окружения Vercel."
            echo "Пока его нет, войны не закрываются и пары не составляются."
            exit 0
          fi

          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST -H "x-cron-secret: $CRON_SECRET" "$URL")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo

          if [ "$code" = "404" ]; then
            echo "::error::Секрет репозитория не совпал с тем, что задан в Vercel"
            exit 1
          fi

          if [ "$code" = "503" ]; then
            echo "::error::В Vercel не задана переменная CRON_SECRET"
            exit 1
          fi

          test "$code" = "200"
